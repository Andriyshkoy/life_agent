name: life-agent-production

x-api-security: &api-security
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  pids_limit: 256
  mem_limit: 768m
  cpus: 1.0
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-api-environment: &api-environment
  LIFE_AGENT_ENVIRONMENT: production
  LIFE_AGENT_ACCESS_TOKEN_HMAC_KEY_FILE: /run/secrets/life_agent_access_token_hmac_key
  LIFE_AGENT_ACCESS_TOKEN_HMAC_KEY_GENERATION: ${LIFE_AGENT_ACCESS_TOKEN_HMAC_KEY_GENERATION:-1}
  LIFE_AGENT_REFRESH_TOKEN_HMAC_KEY_FILE: /run/secrets/life_agent_refresh_token_hmac_key
  LIFE_AGENT_REFRESH_TOKEN_HMAC_KEY_GENERATION: ${LIFE_AGENT_REFRESH_TOKEN_HMAC_KEY_GENERATION:-1}
  LIFE_AGENT_ENROLLMENT_CODE_HMAC_KEY_FILE: /run/secrets/life_agent_enrollment_code_hmac_key
  LIFE_AGENT_ENROLLMENT_CODE_HMAC_KEY_GENERATION: ${LIFE_AGENT_ENROLLMENT_CODE_HMAC_KEY_GENERATION:-1}
  LIFE_AGENT_REPLAY_FINGERPRINT_HMAC_KEY_FILE: /run/secrets/life_agent_replay_fingerprint_hmac_key
  LIFE_AGENT_REPLAY_FINGERPRINT_HMAC_KEY_GENERATION: ${LIFE_AGENT_REPLAY_FINGERPRINT_HMAC_KEY_GENERATION:-1}
  LIFE_AGENT_REPLAY_RESPONSE_ENCRYPTION_KEY_FILE: /run/secrets/life_agent_replay_response_encryption_key
  LIFE_AGENT_REPLAY_RESPONSE_ENCRYPTION_KEY_GENERATION: ${LIFE_AGENT_REPLAY_RESPONSE_ENCRYPTION_KEY_GENERATION:-1}
  LIFE_AGENT_CURSOR_HMAC_KEY_FILE: /run/secrets/life_agent_cursor_hmac_key
  LIFE_AGENT_CURSOR_HMAC_KEY_GENERATION: ${LIFE_AGENT_CURSOR_HMAC_KEY_GENERATION:-1}
  LIFE_AGENT_LOG_LEVEL: ${LIFE_AGENT_LOG_LEVEL:-INFO}
  LIFE_AGENT_DB_POOL_SIZE: ${LIFE_AGENT_DB_POOL_SIZE:-5}
  LIFE_AGENT_DB_MAX_OVERFLOW: ${LIFE_AGENT_DB_MAX_OVERFLOW:-5}
  LIFE_AGENT_DB_POOL_RECYCLE_SECONDS: ${LIFE_AGENT_DB_POOL_RECYCLE_SECONDS:-1800}
  LIFE_AGENT_READINESS_TIMEOUT_SECONDS: ${LIFE_AGENT_READINESS_TIMEOUT_SECONDS:-2.0}

x-api-secrets: &api-secrets
  - source: life_agent_runtime_database_url
    target: life_agent_runtime_database_url
  - source: life_agent_access_token_hmac_key
    target: life_agent_access_token_hmac_key
  - source: life_agent_refresh_token_hmac_key
    target: life_agent_refresh_token_hmac_key
  - source: life_agent_enrollment_code_hmac_key
    target: life_agent_enrollment_code_hmac_key
  - source: life_agent_replay_fingerprint_hmac_key
    target: life_agent_replay_fingerprint_hmac_key
  - source: life_agent_replay_response_encryption_key
    target: life_agent_replay_response_encryption_key
  - source: life_agent_cursor_hmac_key
    target: life_agent_cursor_hmac_key

services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    user: "999:999"
    read_only: true
    environment:
      POSTGRES_DB: life_agent
      POSTGRES_USER: life_agent_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/life_agent_postgres_owner_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - source: life_agent_postgres_owner_password
        target: life_agent_postgres_owner_password
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0775
    networks:
      - private
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    stop_signal: SIGINT
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --quiet --dbname "$${POSTGRES_DB}" --username "$${POSTGRES_USER}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  migrate:
    <<: *api-security
    image: ${LIFE_AGENT_BACKEND_IMAGE:?an immutable backend image digest is required}
    environment:
      LIFE_AGENT_DATABASE_URL_FILE: /run/secrets/life_agent_migration_database_url
    secrets:
      - source: life_agent_migration_database_url
        target: life_agent_migration_database_url
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    profiles:
      - operations

  database-role-init:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    user: "999:999"
    read_only: true
    environment:
      PGHOST: postgres
      PGDATABASE: life_agent
      PGUSER: life_agent_owner
    secrets:
      - source: life_agent_postgres_owner_password
        target: life_agent_postgres_owner_password
      - source: life_agent_postgres_runtime_password
        target: life_agent_postgres_runtime_password
    command:
      - sh
      - -euc
      - |
        owner_password="$$(cat /run/secrets/life_agent_postgres_owner_password)"
        runtime_password="$$(cat /run/secrets/life_agent_postgres_runtime_password)"
        export PGPASSWORD="$${owner_password}"
        psql --no-psqlrc --set ON_ERROR_STOP=1 \
          --set runtime_password="$${runtime_password}" <<'SQL'
        SELECT format(
          'CREATE ROLE life_agent_runtime LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION',
          :'runtime_password'
        )
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'life_agent_runtime'
        ) \gexec
        SELECT format(
          'ALTER ROLE life_agent_runtime PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION',
          :'runtime_password'
        ) \gexec
        REVOKE ALL ON DATABASE life_agent FROM PUBLIC;
        GRANT CONNECT ON DATABASE life_agent TO life_agent_runtime;
        REVOKE CREATE ON SCHEMA public FROM PUBLIC;
        GRANT USAGE ON SCHEMA public TO life_agent_runtime;
        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO life_agent_runtime;
        GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO life_agent_runtime;
        ALTER DEFAULT PRIVILEGES FOR ROLE life_agent_owner IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO life_agent_runtime;
        ALTER DEFAULT PRIVILEGES FOR ROLE life_agent_owner IN SCHEMA public
          GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO life_agent_runtime;
        SQL
        unset owner_password runtime_password PGPASSWORD
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: "no"
    profiles:
      - operations

  api:
    <<: *api-security
    image: ${LIFE_AGENT_BACKEND_IMAGE:?an immutable backend image digest is required}
    environment:
      <<: *api-environment
      LIFE_AGENT_DATABASE_URL_FILE: /run/secrets/life_agent_runtime_database_url
    secrets: *api-secrets
    ports:
      - target: 8080
        published: ${LIFE_AGENT_API_LOOPBACK_PORT:-18080}
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
      - edge
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen(
          'http://127.0.0.1:8080/readyz',timeout=2).read()
          == b'{"status":"ready"}' else 1)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

networks:
  private:
    internal: true
    driver: bridge
  edge:
    driver: bridge

volumes:
  postgres_data:

secrets:
  life_agent_postgres_owner_password:
    file: ${LIFE_AGENT_POSTGRES_OWNER_PASSWORD_SECRET_FILE:?PostgreSQL owner password file is required}
  life_agent_postgres_runtime_password:
    file: ${LIFE_AGENT_POSTGRES_RUNTIME_PASSWORD_SECRET_FILE:?PostgreSQL runtime password file is required}
  life_agent_migration_database_url:
    file: ${LIFE_AGENT_MIGRATION_DATABASE_URL_SECRET_FILE:?migration database URL file is required}
  life_agent_runtime_database_url:
    file: ${LIFE_AGENT_RUNTIME_DATABASE_URL_SECRET_FILE:?runtime database URL file is required}
  life_agent_access_token_hmac_key:
    file: ${LIFE_AGENT_ACCESS_TOKEN_HMAC_KEY_SECRET_FILE:?access-token key file is required}
  life_agent_refresh_token_hmac_key:
    file: ${LIFE_AGENT_REFRESH_TOKEN_HMAC_KEY_SECRET_FILE:?refresh-token key file is required}
  life_agent_enrollment_code_hmac_key:
    file: ${LIFE_AGENT_ENROLLMENT_CODE_HMAC_KEY_SECRET_FILE:?enrollment-code key file is required}
  life_agent_replay_fingerprint_hmac_key:
    file: ${LIFE_AGENT_REPLAY_FINGERPRINT_HMAC_KEY_SECRET_FILE:?replay-fingerprint key file is required}
  life_agent_replay_response_encryption_key:
    file: ${LIFE_AGENT_REPLAY_RESPONSE_ENCRYPTION_KEY_SECRET_FILE:?replay-response key file is required}
  life_agent_cursor_hmac_key:
    file: ${LIFE_AGENT_CURSOR_HMAC_KEY_SECRET_FILE:?cursor key file is required}
