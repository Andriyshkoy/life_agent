server {
    listen 80;
    listen [::]:80;

    server_name life.andriyshkoy.ru;
    server_tokens off;
    access_log off;
    client_max_body_size 2m;

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"life-agent","phase":"bootstrap"}';
    }

    location / {
        return 404;
    }
}
