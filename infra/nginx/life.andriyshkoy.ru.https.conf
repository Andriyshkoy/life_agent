server {
    listen 80;
    listen [::]:80;

    server_name life.andriyshkoy.ru;
    server_tokens off;
    access_log off;

    return 308 https://life.andriyshkoy.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name life.andriyshkoy.ru;
    server_tokens off;
    access_log off;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/life.andriyshkoy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/life.andriyshkoy.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 200 '{"status":"ok","service":"life-agent","phase":"bootstrap"}';
    }

    # The production sync routes are added only when the authenticated API is deployed.
    location / {
        return 404;
    }
}
