server {
    listen 80;
    listen [::]:80;

    server_name life.andriyshkoy.ru;
    server_tokens off;
    access_log off;

    return 308 https://life.andriyshkoy.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name life.andriyshkoy.ru;
    server_tokens off;
    access_log off;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/life.andriyshkoy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/life.andriyshkoy.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 204;
    }

    location = /dev.apk {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        add_header Cache-Control "no-store" always;
        return 302 https://github.com/Andriyshkoy/life_agent/releases/download/dev-latest/life-agent-dev.apk;
    }

    location = /api/v1/auth/enroll {
        if ($request_method != POST) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_hide_header Server;
    }

    location = /api/v1/auth/refresh {
        if ($request_method != POST) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_hide_header Server;
    }

    location = /api/v1/auth/revoke {
        if ($request_method != POST) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_hide_header Server;
    }

    location = /api/v1/sync/bootstrap {
        if ($request_method != POST) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_hide_header Server;
    }

    location = /api/v1/sync/push {
        if ($request_method != POST) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_hide_header Server;
    }

    location = /api/v1/sync/pull {
        if ($request_method != POST) {
            return 404;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
