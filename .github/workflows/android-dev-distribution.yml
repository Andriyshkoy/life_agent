name: android-dev-distribution

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: android-dev-distribution
  cancel-in-progress: false

jobs:
  publish:
    name: publish-dev-apk
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev-distribution
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      LIFE_AGENT_KEYSTORE_PASSWORD: ${{ secrets.LIFE_AGENT_DEV_KEYSTORE_PASSWORD }}
      LIFE_AGENT_KEY_PASSWORD: ${{ secrets.LIFE_AGENT_DEV_KEYSTORE_PASSWORD }}
      LIFE_AGENT_KEY_ALIAS: life-agent-dev
    steps:
      - name: Check out the verified develop revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFE_AGENT_DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$LIFE_AGENT_KEYSTORE_PASSWORD" ]; then
            echo "Dev distribution signing secrets are not configured."
            exit 1
          fi

          echo \
            "LIFE_AGENT_KEYSTORE_PATH=/tmp/life-agent-signing/life-agent-dev.p12" \
            >> "$GITHUB_ENV"

          install -d -m 0700 "$RUNNER_TEMP/life-agent-signing"
          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/life-agent-signing/life-agent-dev.p12"
          chmod 0600 "$RUNNER_TEMP/life-agent-signing/life-agent-dev.p12"

      - name: Build pinned Android toolchain image
        run: |
          docker build \
            --file android/life-agent/Dockerfile.build \
            --tag life-agent-product-builder:distribution \
            android/life-agent

      - name: Download verified unsigned APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci \
                --branch develop \
                --event push \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId'
            )"
          fi

          test -n "$SOURCE_RUN_ID"
          install -d -m 0700 "$RUNNER_TEMP/unsigned"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name life-agent-internal-unsigned \
            --dir "$RUNNER_TEMP/unsigned"

          test -s "$RUNNER_TEMP/unsigned/app-internal-unsigned.apk"

      - name: Sign and verify APK
        run: |
          install -d -m 0700 "$RUNNER_TEMP/distribution"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env LIFE_AGENT_KEYSTORE_PATH \
            --env LIFE_AGENT_KEYSTORE_PASSWORD \
            --env LIFE_AGENT_KEY_ALIAS \
            --env LIFE_AGENT_KEY_PASSWORD \
            --volume \
              "$RUNNER_TEMP/life-agent-signing:/tmp/life-agent-signing:ro" \
            --volume "$RUNNER_TEMP/unsigned:/unsigned:ro" \
            --volume "$RUNNER_TEMP/distribution:/distribution" \
            life-agent-product-builder:distribution \
            /opt/android-sdk/build-tools/36.0.0/apksigner \
              sign \
              --ks "$LIFE_AGENT_KEYSTORE_PATH" \
              --ks-key-alias "$LIFE_AGENT_KEY_ALIAS" \
              --ks-pass env:LIFE_AGENT_KEYSTORE_PASSWORD \
              --key-pass env:LIFE_AGENT_KEY_PASSWORD \
              --out /distribution/life-agent-dev.apk \
              /unsigned/app-internal-unsigned.apk

          docker run --rm \
            --volume "$RUNNER_TEMP/distribution:/distribution:ro" \
            life-agent-product-builder:distribution \
            /opt/android-sdk/build-tools/36.0.0/apksigner \
              verify \
              --verbose \
              /distribution/life-agent-dev.apk

          package_line="$(
            docker run --rm \
              --volume "$RUNNER_TEMP/distribution:/distribution:ro" \
              life-agent-product-builder:distribution \
              /opt/android-sdk/build-tools/36.0.0/aapt \
                dump \
                badging \
                /distribution/life-agent-dev.apk |
              head -1
          )"
          LIFE_AGENT_VERSION_NAME="$(
            printf '%s\n' "$package_line" |
              sed -n "s/^package: .*versionName='\\([^']*\\)'.*/\\1/p"
          )"

          test -n "$LIFE_AGENT_VERSION_NAME"
          echo "LIFE_AGENT_VERSION_NAME=$LIFE_AGENT_VERSION_NAME" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/distribution/life-agent-dev.apk"

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev-latest \
              "$RUNNER_TEMP/distribution/life-agent-dev.apk#Life Agent Dev APK" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit dev-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Life Agent Dev · $LIFE_AGENT_VERSION_NAME" \
              --notes "Автоматическая тестовая сборка из проверенной ветки develop." \
              --prerelease
          else
            gh release create dev-latest \
              "$RUNNER_TEMP/distribution/life-agent-dev.apk#Life Agent Dev APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Life Agent Dev · $LIFE_AGENT_VERSION_NAME" \
              --notes "Автоматическая тестовая сборка из проверенной ветки develop." \
              --prerelease
          fi
