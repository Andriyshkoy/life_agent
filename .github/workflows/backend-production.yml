name: backend-production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  verified_main:
    name: verified-main
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.required_ci.outputs.ready }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Pin the current main revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The verified source revision is malformed."
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          current_main_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [ "$current_main_sha" != "$SOURCE_SHA" ]; then
            echo "This completed verification belongs to a stale main revision."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Require all successful checks for the exact main revision
        id: required_ci
        if: steps.source.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          required_workflows=(
            ci.yml
            android-m1-instrumented.yml
          )
          deadline=$((SECONDS + 5700))
          while (( SECONDS < deadline )); do
            current_main_sha="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
                --jq '.object.sha'
            )"
            if [ "$current_main_sha" != "$SOURCE_SHA" ]; then
              echo "Main advanced before required checks completed."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            all_succeeded=true
            for workflow_file in "${required_workflows[@]}"; do
              check_record="$(
                gh api \
                  --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs" \
                  --field branch=main \
                  --field event=push \
                  --field head_sha="$SOURCE_SHA" \
                  --field per_page=100 \
                  --jq '
                    .workflow_runs
                    | map(select(.head_repository.full_name == env.GITHUB_REPOSITORY))
                    | sort_by(.id)
                    | last
                    | if . == null then "" else
                        [.status, (.conclusion // ""), .head_sha, .event, .head_branch]
                        | @tsv
                      end
                  '
              )"

              if [ -z "$check_record" ]; then
                all_succeeded=false
                continue
              fi
              IFS=$'\t' read -r status conclusion head_sha event head_branch \
                <<<"$check_record"
              if [ "$head_sha" != "$SOURCE_SHA" ] ||
                [ "$event" != "push" ] ||
                [ "$head_branch" != "main" ]; then
                echo "Required check metadata did not match the main revision."
                exit 1
              fi
              if [ "$status" != "completed" ]; then
                all_succeeded=false
                continue
              fi
              if [ "$conclusion" != "success" ]; then
                echo "A required workflow did not succeed for the main revision."
                exit 1
              fi
            done

            if [ "$all_succeeded" = true ]; then
              current_main_sha="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
                  --jq '.object.sha'
              )"
              if [ "$current_main_sha" != "$SOURCE_SHA" ]; then
                echo "Main advanced while required checks were completing."
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done

          echo "Timed out waiting for required workflows on the main revision."
          exit 1

  publish:
    name: publish-backend-image
    needs: verified_main
    if: needs.verified_main.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    env:
      SOURCE_SHA: ${{ needs.verified_main.outputs.source_sha }}
    steps:
      - name: Check out the verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Derive immutable publication coordinates
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ] ||
            [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The checked-out source does not match the verified revision."
            exit 1
          fi

          repository_path="${GITHUB_REPOSITORY,,}"
          if [[ ! "$repository_path" =~ ^[a-z0-9][a-z0-9._/-]+$ ]]; then
            echo "The container repository path is malformed."
            exit 1
          fi
          image_repository="ghcr.io/${repository_path}/backend"
          image_commit_ref="${image_repository}:sha-${SOURCE_SHA}"
          echo "IMAGE_REPOSITORY=$image_repository" >> "$GITHUB_ENV"
          echo "IMAGE_COMMIT_REF=$image_commit_ref" >> "$GITHUB_ENV"

      - name: Build and verify the pinned backend image
        run: |
          set -euo pipefail

          docker build \
            --file backend/Dockerfile \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_COMMIT_REF" \
            backend
          backend/scripts/verify-runtime-image.sh "$IMAGE_COMMIT_REF"
          built_image_id="$(
            docker image inspect --format '{{.Id}}' "$IMAGE_COMMIT_REF"
          )"
          if [[ ! "$built_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The locally verified image identifier is malformed."
            exit 1
          fi
          echo "BUILT_IMAGE_ID=$built_image_id" >> "$GITHUB_ENV"

      - name: Publish and verify the immutable registry digest
        id: publish
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail

          docker_config="$RUNNER_TEMP/life-agent-docker-auth"
          install -d -m 0700 "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          cleanup_registry_auth() {
            local exit_status="$?"
            trap - EXIT
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$docker_config"
            exit "$exit_status"
          }
          trap cleanup_registry_auth EXIT

          printf '%s' "$REGISTRY_PASSWORD" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin \
              >/dev/null
          docker push "$IMAGE_COMMIT_REF" >/dev/null
          docker pull "$IMAGE_COMMIT_REF" >/dev/null

          immutable_ref=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$IMAGE_REPOSITORY@sha256:"* ]]; then
              if [ -n "$immutable_ref" ] && [ "$immutable_ref" != "$candidate" ]; then
                echo "The published tag resolved to multiple registry digests."
                exit 1
              fi
              immutable_ref="$candidate"
            fi
          done < <(
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$IMAGE_COMMIT_REF"
          )

          digest="${immutable_ref#"$IMAGE_REPOSITORY@"}"
          if [ "$immutable_ref" != "$IMAGE_REPOSITORY@$digest" ] ||
            [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The registry did not return one immutable backend digest."
            exit 1
          fi

          docker pull "$immutable_ref" >/dev/null
          published_revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$immutable_ref"
          )"
          if [ "$published_revision" != "$SOURCE_SHA" ]; then
            echo "The published image revision label does not match its source."
            exit 1
          fi
          published_image_id="$(
            docker image inspect --format '{{.Id}}' "$immutable_ref"
          )"
          if [ "$published_image_id" != "$BUILT_IMAGE_ID" ]; then
            echo "The registry image does not match the locally verified image."
            exit 1
          fi
          backend/scripts/verify-runtime-image.sh "$immutable_ref"

          echo "image_ref=$immutable_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy-production-backend
    needs:
      - verified_main
      - publish
    if: >-
      needs.verified_main.outputs.ready == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      IMMUTABLE_IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
      SOURCE_SHA: ${{ needs.verified_main.outputs.source_sha }}
    steps:
      - name: Check out the deployed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Validate the tracked production bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_prefix="ghcr.io/${GITHUB_REPOSITORY,,}/backend@"
          digest="${IMMUTABLE_IMAGE_REF#"$expected_prefix"}"
          if [ "$IMMUTABLE_IMAGE_REF" != "$expected_prefix$digest" ] ||
            [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Refusing a mutable or foreign backend image reference."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "The deployment bundle does not match the verified source."
            exit 1
          fi
          current_main_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [ "$current_main_sha" != "$SOURCE_SHA" ]; then
            echo "Refusing to deploy a revision that is no longer current main."
            exit 1
          fi

          for path in \
            infra/production/compose.production.yaml \
            infra/production/deploy-backend.sh \
            infra/production/rollback-backend.sh \
            infra/production/lib.sh; do
            if [ ! -f "$path" ] || [ -L "$path" ]; then
              echo "The tracked production deployment bundle is incomplete."
              exit 1
            fi
          done
          bash -n infra/production/deploy-backend.sh
          bash -n infra/production/rollback-backend.sh
          bash -n infra/production/lib.sh

      - name: Deploy the immutable image through the protected host boundary
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$PROD_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] ||
            [[ ! "$PROD_SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] ||
            [ -z "$PROD_SSH_PRIVATE_KEY" ] ||
            [ -z "$PROD_SSH_HOST_KEY" ]; then
            echo "Production SSH credentials are missing or malformed."
            exit 1
          fi

          ssh_root="$RUNNER_TEMP/life-agent-production-ssh"
          ssh_key="$ssh_root/id"
          known_hosts="$ssh_root/known_hosts"
          ssh_config="$ssh_root/config"
          bundle_root="$RUNNER_TEMP/life-agent-production-release"
          install -d -m 0700 "$ssh_root" "$bundle_root/infra/production"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" >"$ssh_key"
          printf '%s\n' "$PROD_SSH_HOST_KEY" >"$known_hosts"
          chmod 0600 "$ssh_key" "$known_hosts"
          ssh-keygen -y -f "$ssh_key" >/dev/null
          ssh-keygen -l -f "$known_hosts" >/dev/null

          {
            printf 'Host life-agent-production\n'
            printf '  HostName %s\n' "$PROD_SSH_HOST"
            printf '  User %s\n' "$PROD_SSH_USER"
            printf '  IdentityFile %s\n' "$ssh_key"
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
            printf '  GlobalKnownHostsFile /dev/null\n'
            printf '  IdentitiesOnly yes\n'
            printf '  IdentityAgent none\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UpdateHostKeys no\n'
            printf '  BatchMode yes\n'
            printf '  PasswordAuthentication no\n'
            printf '  KbdInteractiveAuthentication no\n'
            printf '  ConnectTimeout 15\n'
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 2\n'
            printf '  LogLevel ERROR\n'
          } >"$ssh_config"
          chmod 0600 "$ssh_config"

          install -m 0644 \
            infra/production/compose.production.yaml \
            "$bundle_root/infra/production/compose.production.yaml"
          install -m 0755 \
            infra/production/deploy-backend.sh \
            infra/production/rollback-backend.sh \
            infra/production/lib.sh \
            "$bundle_root/infra/production/"

          remote_release_dir=""
          cleanup() {
            local exit_status="$?"
            trap - EXIT
            if [[
              "$remote_release_dir" =~ ^/tmp/life-agent-release\.[a-zA-Z0-9]+$
            ]]; then
              ssh -F "$ssh_config" life-agent-production \
                /bin/rm -rf -- "$remote_release_dir" \
                >/dev/null 2>&1 || true
            fi
            rm -rf -- "$ssh_root" "$bundle_root"
            exit "$exit_status"
          }
          trap cleanup EXIT

          remote_release_dir="$(
            ssh -F "$ssh_config" life-agent-production \
              'umask 077; mktemp -d /tmp/life-agent-release.XXXXXXXX'
          )"
          if [[
            ! "$remote_release_dir" =~ ^/tmp/life-agent-release\.[a-zA-Z0-9]+$
          ]]; then
            echo "The production host returned an invalid release directory."
            exit 1
          fi

          scp -F "$ssh_config" -r -- \
            "$bundle_root/infra" \
            "life-agent-production:$remote_release_dir/"
          current_main_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [ "$current_main_sha" != "$SOURCE_SHA" ]; then
            echo "Refusing stale main immediately before production deployment."
            exit 1
          fi
          ssh -F "$ssh_config" life-agent-production \
            sudo -- \
            "$remote_release_dir/infra/production/deploy-backend.sh" \
            "$IMMUTABLE_IMAGE_REF"
