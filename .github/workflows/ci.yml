name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Keep this workflow free of path filters so every protected branch receives
# the same required checks, including when shared CI or dependency files change.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    name: release-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require develop as the production release source
        env:
          RELEASE_HEAD: ${{ github.head_ref }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$RELEASE_HEAD" != "develop" ] ||
            [ "$RELEASE_HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
            echo "Pull requests into main must come from this repository's develop branch."
            exit 1
          fi

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate schemas, fixtures, docs, and seed files
        run: |
          python scripts/validate_schemas.py
          python scripts/validate_repository.py
          python scripts/validate_android_security.py
          python -m unittest scripts.test_validate_android_security
          bash -n scripts/run_android_m1_instrumented_ci.sh
          bash -n scripts/run_android_m1_cold_start_smoke.sh
          bash -n infra/nginx/install-life-vhost.sh
          bash -n infra/nginx/update-life-vhost.sh
          (
            cd android/health-probe/dist
            sha256sum --check SHA256SUMS
          )

  backend-quality:
    name: backend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      UV_LOCKED: "true"
      UV_NO_PROGRESS: "true"
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up locked Python dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked backend environment
        run: uv sync --locked --all-groups

      - name: Check backend formatting
        run: uv run --locked ruff format --check .

      - name: Lint backend
        run: uv run --locked ruff check .

      - name: Type-check backend
        run: uv run --locked mypy

      - name: Run backend tests without PostgreSQL
        run: uv run --locked pytest -q -m "not postgres"

      - name: Compile backend Python sources
        run: uv run --locked python -m compileall -q src tests migrations

  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_LOCKED: "true"
      UV_NO_PROGRESS: "true"
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up locked Python dependency manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked backend environment
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Run hermetic PostgreSQL 17 integration
        run: backend/scripts/run_postgres_integration.sh

  backend-container:
    name: backend-container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned backend runtime image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag life-agent-backend:ci \
            backend

      - name: Smoke-test liveness and pre-migration readiness
        run: |
          set -euo pipefail

          container_name=life-agent-backend-ci
          ready_body="$RUNNER_TEMP/life-agent-backend-ready.json"

          derive_ci_hmac_key() {
            printf 'life-agent-ci-only-%s' "$1" |
              openssl dgst -sha256 -binary |
              openssl base64 -A |
              tr '+/' '-_' |
              tr -d '='
          }
          access_token_hmac_key="$(derive_ci_hmac_key access-token)"
          refresh_token_hmac_key="$(derive_ci_hmac_key refresh-token)"
          enrollment_code_hmac_key="$(derive_ci_hmac_key enrollment-code)"
          cursor_hmac_key="$(derive_ci_hmac_key cursor)"

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" || true
            fi
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name "$container_name" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1::8080 \
            --env LIFE_AGENT_ENVIRONMENT=test \
            --env LIFE_AGENT_DATABASE_URL=postgresql+asyncpg://life_agent_ci:ci-only@127.0.0.1:9/life_agent_ci \
            --env LIFE_AGENT_ACCESS_TOKEN_HMAC_KEY="$access_token_hmac_key" \
            --env LIFE_AGENT_REFRESH_TOKEN_HMAC_KEY="$refresh_token_hmac_key" \
            --env LIFE_AGENT_ENROLLMENT_CODE_HMAC_KEY="$enrollment_code_hmac_key" \
            --env LIFE_AGENT_CURSOR_HMAC_KEY="$cursor_hmac_key" \
            life-agent-backend:ci

          published_endpoint="$(docker port "$container_name" 8080/tcp)"
          backend_port="${published_endpoint##*:}"
          if [[ ! "$backend_port" =~ ^[0-9]{1,5}$ ]]; then
            echo "Failed to resolve the backend smoke-test port."
            exit 1
          fi

          health_body=
          for _ in $(seq 1 30); do
            if health_body="$(
              curl \
                --fail \
                --silent \
                --max-time 2 \
                "http://127.0.0.1:${backend_port}/healthz"
            )"; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != true ]; then
              echo "Backend container exited during startup."
              exit 1
            fi
            sleep 1
          done

          if [ "$health_body" != '{"status":"ok"}' ]; then
            echo "Unexpected liveness response."
            exit 1
          fi
          if [ "$(docker inspect --format '{{.Config.User}}' "$container_name")" != 10001:10001 ]; then
            echo "Backend runtime image is not configured for its unprivileged user."
            exit 1
          fi

          ready_status="$(
            curl \
              --silent \
              --show-error \
              --max-time 3 \
              --output "$ready_body" \
              --write-out '%{http_code}' \
              "http://127.0.0.1:${backend_port}/readyz"
          )"
          if [ "$ready_status" != 503 ]; then
            echo "Backend reported ready without its database or migrations."
            exit 1
          fi
          if [ "$(tr -d '\r\n' < "$ready_body")" != '{"status":"not_ready"}' ]; then
            echo "Unexpected pre-migration readiness response."
            exit 1
          fi

  android-probe:
    name: android-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned Android toolchain image
        run: |
          docker build \
            --file android/health-probe/Dockerfile.build \
            --tag life-agent-health-probe-builder:ci \
            android/health-probe

      - name: Lint, test, and assemble the Day-0 probe
        run: |
          mkdir -p \
            "$RUNNER_TEMP/life-agent-probe-android-user-home" \
            "$RUNNER_TEMP/life-agent-probe-user-home" \
            "$RUNNER_TEMP/life-agent-probe-gradle-home"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ANDROID_USER_HOME=/tmp/android-user-home \
            --env GRADLE_USER_HOME=/tmp/gradle-home \
            --volume "$RUNNER_TEMP/life-agent-probe-android-user-home:/tmp/android-user-home" \
            --volume "$RUNNER_TEMP/life-agent-probe-user-home:/home/gradle" \
            --volume "$RUNNER_TEMP/life-agent-probe-gradle-home:/tmp/gradle-home" \
            --volume "$GITHUB_WORKSPACE/android/health-probe:/workspace" \
            life-agent-health-probe-builder:ci \
            gradle --no-daemon --stacktrace \
              :app:lintDebug \
              :app:testDebugUnitTest \
              :app:assembleDebug

      - name: Verify published APK payload matches the source build
        run: |
          python3 scripts/validate_apk_payload.py \
            android/health-probe/dist/life-agent-health-probe-day0-v0.2.0.apk \
            android/health-probe/app/build/outputs/apk/debug/app-debug.apk

  android-product:
    name: android-product
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned Android toolchain image
        run: |
          docker build \
            --file android/life-agent/Dockerfile.build \
            --tag life-agent-product-builder:ci \
            android/life-agent

      - name: Lint, test, assemble, and validate UI screenshots
        run: |
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p \
            "$RUNNER_TEMP/life-agent-product-android-user-home" \
            "$RUNNER_TEMP/life-agent-product-home" \
            "$RUNNER_TEMP/life-agent-product-gradle-home"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ANDROID_USER_HOME=/tmp/android-user-home \
            --env GRADLE_USER_HOME=/tmp/gradle-home \
            --volume "$RUNNER_TEMP/life-agent-product-android-user-home:/tmp/android-user-home" \
            --volume "$RUNNER_TEMP/life-agent-product-home:/home/gradle" \
            --volume "$RUNNER_TEMP/life-agent-product-gradle-home:/tmp/gradle-home" \
            --env LIFE_AGENT_VERSION_CODE="$version_code" \
            --env LIFE_AGENT_VERSION_NAME="0.1.0.$GITHUB_RUN_NUMBER+$short_sha" \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo/android/life-agent \
            life-agent-product-builder:ci \
            ./gradlew --no-daemon --stacktrace \
              :app:lintDebug \
              :app:testDebugUnitTest \
              :app:assembleDebug \
              :app:assembleDebugAndroidTest \
              :app:assembleInternal \
              :app:validateDebugScreenshotTest

      - name: Validate merged Android security declarations
        run: |
          python3 scripts/validate_android_security.py \
            --merged-manifest \
              android/life-agent/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml \
            --merged-manifest \
              android/life-agent/app/build/intermediates/merged_manifests/internal/processInternalManifest/AndroidManifest.xml

      - name: Preserve verified unsigned internal APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: life-agent-internal-unsigned
          path: android/life-agent/app/build/outputs/apk/internal/app-internal-unsigned.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
