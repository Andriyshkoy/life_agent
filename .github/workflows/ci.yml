name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Keep this workflow free of path filters so every protected branch receives
# the same required checks, including when shared CI or dependency files change.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    name: release-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require a verified production release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD: ${{ github.head_ref }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RELEASE_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -Eeuo pipefail

          release_source_error() {
            echo "Production release source verification failed."
            exit 1
          }

          read_branch_sha() {
            local branch_name="$1"
            gh api \
              --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$CURRENT_REPOSITORY/git/ref/heads/$branch_name" \
              --jq '.object.sha'
          }

          read_tree_sha() {
            local commit_sha="$1"
            gh api \
              --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$CURRENT_REPOSITORY/git/commits/$commit_sha" \
              --jq '.tree.sha'
          }

          if [ "$RELEASE_HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ] ||
            [ "$RELEASE_HEAD_REPOSITORY_ID" != "$CURRENT_REPOSITORY_ID" ] ||
            [[ ! "$CURRENT_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]; then
            release_source_error
          fi

          if [[ ! "$RELEASE_HEAD" =~ ^release/[a-z0-9][a-z0-9._/-]{0,119}$ ]]; then
            release_source_error
          fi
          if [[ ! "$RELEASE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$RELEASE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            release_source_error
          fi

          current_main_sha="$(read_branch_sha main)"
          current_develop_sha="$(read_branch_sha develop)"
          current_release_sha="$(read_branch_sha "$RELEASE_HEAD")"
          for observed_sha in \
            "$current_main_sha" \
            "$current_develop_sha" \
            "$current_release_sha"; do
            if [[ ! "$observed_sha" =~ ^[0-9a-f]{40}$ ]]; then
              release_source_error
            fi
          done
          if [ "$RELEASE_BASE_SHA" != "$current_main_sha" ] ||
            [ "$RELEASE_HEAD_SHA" != "$current_release_sha" ]; then
            release_source_error
          fi

          compare_record="$(
            gh api \
              --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$CURRENT_REPOSITORY/compare/$current_main_sha...$RELEASE_HEAD_SHA" \
              --jq '[.status, (.behind_by | tostring), .base_commit.sha, .merge_base_commit.sha] | @tsv'
          )"
          IFS=$'\t' read -r \
            compare_status \
            compare_behind_by \
            compare_base_sha \
            compare_merge_base_sha \
            <<<"$compare_record"
          if [[ ! "$compare_status" =~ ^(ahead|identical)$ ]] ||
            [ "$compare_behind_by" != "0" ] ||
            [ "$compare_base_sha" != "$current_main_sha" ] ||
            [ "$compare_merge_base_sha" != "$current_main_sha" ]; then
            release_source_error
          fi

          release_tree_sha="$(read_tree_sha "$RELEASE_HEAD_SHA")"
          develop_tree_sha="$(read_tree_sha "$current_develop_sha")"
          if [[ ! "$release_tree_sha" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$develop_tree_sha" =~ ^[0-9a-f]{40}$ ]] ||
            [ "$release_tree_sha" != "$develop_tree_sha" ]; then
            release_source_error
          fi

          if [ "$(read_branch_sha main)" != "$current_main_sha" ] ||
            [ "$(read_branch_sha develop)" != "$current_develop_sha" ] ||
            [ "$(read_branch_sha "$RELEASE_HEAD")" != "$RELEASE_HEAD_SHA" ]; then
            release_source_error
          fi

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate repository contracts and policy
        run: |
          python scripts/validate_schemas.py
          python scripts/validate_repository.py
          python scripts/validate_android_security.py
          python scripts/validate_android_distribution_workflow.py
          python -m unittest scripts.test_validate_android_security
          python -m unittest scripts.test_validate_android_distribution_workflow
          bash -n scripts/run_android_local_instrumented_ci.sh
          bash -n scripts/run_android_local_cold_start_smoke.sh

  android-product:
    name: android-product
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned Android toolchain image
        run: |
          docker build \
            --file android/life-agent/Dockerfile.build \
            --tag life-agent-product-builder:ci \
            android/life-agent

      - name: Lint, test, assemble, and validate UI screenshots
        run: |
          mkdir -p \
            "$RUNNER_TEMP/life-agent-product-android-user-home" \
            "$RUNNER_TEMP/life-agent-product-home" \
            "$RUNNER_TEMP/life-agent-product-gradle-home"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ANDROID_USER_HOME=/tmp/android-user-home \
            --env GRADLE_USER_HOME=/tmp/gradle-home \
            --volume "$RUNNER_TEMP/life-agent-product-android-user-home:/tmp/android-user-home" \
            --volume "$RUNNER_TEMP/life-agent-product-home:/home/gradle" \
            --volume "$RUNNER_TEMP/life-agent-product-gradle-home:/tmp/gradle-home" \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo/android/life-agent \
            life-agent-product-builder:ci \
            ./gradlew --no-daemon --stacktrace \
              :app:lintDebug \
              :app:testDebugUnitTest \
              :app:assembleDebug \
              :app:assembleDebugAndroidTest \
              :app:validateDebugScreenshotTest

      - name: Validate merged Android security declarations
        run: |
          python3 scripts/validate_android_security.py \
            --merged-manifest \
              android/life-agent/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
