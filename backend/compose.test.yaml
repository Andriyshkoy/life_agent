name: life-agent-backend-test

services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_DB: life_agent_test
      POSTGRES_PASSWORD: life-agent-hermetic-test-password
      POSTGRES_USER: life_agent_test
      LIFE_AGENT_TEST_RESET_SENTINEL_SHA256: ${LIFE_AGENT_TEST_RESET_SENTINEL_SHA256:?}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - type: bind
        source: ./scripts/init-postgres-test-guard.sh
        target: /docker-entrypoint-initdb.d/10-life-agent-test-guard.sh
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --dbname "$${POSTGRES_DB}" --username "$${POSTGRES_USER}"
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: "no"
