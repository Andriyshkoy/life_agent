[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "life-agent-backend"
version = "0.1.0"
description = "Private Life Agent backend service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "jsonschema>=4.23,<5",
    "pydantic-settings>=2.10,<3",
    "referencing>=0.35,<1",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
life-agent-admin = "life_agent_backend.admin_cli:main"

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "httpx>=0.28,<1",
    "jsonschema==4.23.0",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-jsonschema==4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/life_agent_backend"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-p", "no:cacheprovider"]
asyncio_mode = "auto"
markers = [
    "postgres: requires a dedicated ephemeral loopback PostgreSQL database",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["N999"]
"tests/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
